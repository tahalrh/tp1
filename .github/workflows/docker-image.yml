name: CI/CD Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Etape A : Recuperer le code source depuis GitHub
      - name: 1. Checkout du code
        uses: actions/checkout@v4

      # Etape B : Configurer l'outil de construction avance de Docker (Buildx)
      - name: 2. Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Etape C : Se connecter a Docker Hub sans exposer le mot de passe
      - name: 3. Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      # Etape D : Construire l'image et l'envoyer directement sur Docker Hub
      - name: 4. Build et Push de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/tp1:latest
